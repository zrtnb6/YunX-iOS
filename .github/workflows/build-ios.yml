name: Build iOS IPA (Liquid Glass / Xcode 26)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA (Xcode 26 / iOS 26 SDK)
    # macos-26 runner ships Xcode 26.x with the iOS 26 SDK.
    # Linking against the iOS 26 SDK is what gives the app Liquid Glass
    # automatically when run on iOS 26 — no SwiftUI code changes required.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # On the macos-26 image /Applications/Xcode.app symlinks to Xcode 26.x.
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.$(date -u +%Y%m%d%H%M)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "resolved version: $VERSION"

      - name: Build (arm64, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project YunX.xcodeproj \
            -scheme YunX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            build | tee build.log
          echo "---- tail ----"
          tail -n 40 build.log

      - name: Ad-hoc sign and package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/YunX.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi

          # 关键：必须做 ad-hoc 签名。
          # 零签名的 Mach-O 会被 iOS 内核直接 SIGKILL（表现就是「装上但点开闪退」）。
          # ad-hoc 签名后：TrollStore 可直接运行，Sideloadly / AltStore 重签也更稳。
          echo "---- ad-hoc signing ----"
          codesign --force --timestamp=none --sign - "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 || true
          echo "---- verify ----"
          # 签名校验失败必须让 job 失败：以前加 || true，坏包会一路进 Release
          codesign --verify --verbose=2 "$APP_PATH"

          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          chmod +x "out/Payload/YunX.app/YunX"
          cd out
          zip -qry "../YunX.ipa" Payload
          cd ..
          ls -lh YunX.ipa
          unzip -l YunX.ipa | head -n 20

      - name: Extract dSYM info
        if: always()
        run: |
          find build/Build/Products -name "*.dSYM" -maxdepth 3 || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YunX-ipa
          path: YunX.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: YunX.ipa
          generate_release_notes: true
